site_name: LLM Engineering Knowledge Base
site_description: Personal knowledge extraction from Ed Donner's LLM Engineering course
site_author: Personal Study Notes

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.code.annotate

  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: en
  - tags

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md

  - Topic References:
      - reference/index.md
      - LLM Foundations (Weeks 1-3): reference/llm-foundations.md
      - Model Selection & Benchmarks (Week 4): reference/model-selection-benchmarks.md
      - RAG & Vector Search (Week 5): reference/rag-and-vector-search.md
      - Training & Fine-Tuning (Weeks 6-7): reference/training-and-finetuning.md
      - Agents & Deployment (Week 8): reference/agents-and-deployment.md
      - API Keys & Runnability: reference/api-keys-and-runnability.md
      - Lecture Distillation Workflow: reference/lecture-distillation-workflow.md

  # Individual lecture notes are reachable from the index, not listed here -
  # the course has 210 lectures and the nav would be unreadable.
  - Lecture Notes: lectures/index.md

  - Topics:
      - Foundations:
          - LLM APIs & Integration: topics/01-foundations/llm-apis.md
          - Development Tools: topics/01-foundations/dev-tools.md

      - Core Concepts:
          - Prompt Engineering: topics/02-core-concepts/prompt-engineering.md
          - Model Selection: topics/02-core-concepts/model-selection.md
          - Tokenization: topics/02-core-concepts/tokenization.md

      - Integration:
          - Multi-Model Orchestration: topics/03-integration/multi-model.md

      - RAG Systems:
          - RAG Overview: topics/04-rag/rag-systems.md
          - Embeddings: topics/04-rag/embeddings.md
          - Vector Databases: topics/04-rag/vector-databases.md

      - Agents:
          - Agent Architectures: topics/05-agents/agent-architectures.md
          - Tool Use: topics/05-agents/tool-use.md
          - Multi-Agent Systems: topics/05-agents/multi-agent.md

      - Training:
          - Fine-Tuning: topics/06-training/fine-tuning.md
          - Dataset Preparation: topics/06-training/dataset-prep.md
          - Evaluation: topics/06-training/evaluation.md

      - GPU Computing:
          - GPU Basics: topics/07-gpu/gpu-computing.md

      - Production:
          - Deployment: topics/08-production/deployment.md
          - UI & Interaction: topics/08-production/ui-interaction.md

  - Quick Reference:
      - quick-ref/api-syntax.md
      - quick-ref/common-errors.md
      - quick-ref/code-snippets.md

  - Week Summaries:
      - week-summaries/week1.md
      - week-summaries/week2.md
      - week-summaries/week3.md
      - week-summaries/week4.md
      - week-summaries/week5.md
      - week-summaries/week6.md
      - week-summaries/week7.md
      - week-summaries/week8.md

  - Projects:
      - projects/website-summarizer.md
      - projects/multi-model.md
      - projects/rag-system.md
      - projects/price-is-right.md
      - projects/autonomous-agents.md

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://edwarddonner.com/
      name: Course Website

copyright: Personal study notes from Ed Donner's LLM Engineering course. Not affiliated with or endorsed by the course.
